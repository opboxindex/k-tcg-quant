name: Collect auction market

# 경매 시장 관측 + 정산 감시목록 채우기 — 2026-09-03 두 모드로 재편.
#   전수(07:20 UTC, 창 시작 직후): 가격 밴드 × 전 페이지(~440콜). 시장 관측점을 찍고 24시간 안에 끝날 경매를 감시목록에.
#   보충(3시간마다, --topup): 종료 임박 순 앞쪽만(~50콜). 다음 9시간 안에 끝날 경매를 감시목록에 보태고 가격 표본만 합친다.
# 왜: eBay 쿼터 창은 07:00 UTC 리셋(실측). 종전엔 전수를 하루 8번 돌려 쿼터의 70% 를 썼고, 창 뒷부분에서
# "정산 몫 남기기" 규칙에 걸려 검색이 통째로 건너뛰어졌다 → 감시목록 0건 → 그 시간대 종료 경매 영구 손실(9/2·9/3).
# 검색은 가장 싸고 가장 급하다(감시목록에 없으면 정산 자체가 불가능) — 그래서 싸게 자주 돈다.
# data/auction-market.json data/auction-watch.json 은 이 워크플로가 단독으로 소유한다 — 다른 워크플로가 같이 쓰면 충돌한다.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full = 전수(시장 관측점 갱신) · topup = 감시목록 보충만(싸다). 자가치유는 기본값(topup)으로 부른다."
        type: choice
        options: [topup, full]
        default: topup
  schedule:
    # ⚠️ 두 줄로 나눈 이유: github.event.schedule 은 매칭된 cron 문자열 그대로라, 첫 줄만 전수로 분기할 수 있다.
    - cron: "20 7 * * *"                     # 전수 — 창 시작 직후(KST 16:20)
    - cron: "20 1,4,10,13,16,19,22 * * *"    # 보충 — 3시간 간격

permissions:
  contents: write

# 정산(settle-auctions)과 같은 그룹 — 둘 다 data/auction-watch.json 을 통째로 다시 쓴다(검색은 추가, 정산은 제거).
# 동시에 돌면 뒤에 푸시하는 쪽이 rebase 충돌로 죽는다(2026-09-04 00:17 UTC 실제 사고). 같은 그룹이면 순서대로 돈다.
concurrency:
  group: auction-ledger
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      EBAY_MARKETPLACE_ID: EBAY_US

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 쿼터 게이트 없음 — 스크립트가 잔여를 보고 스스로 판단한다(부족하면 0건으로 정상 종료).
      # 게이트로 exit 1 하면 워크플로가 죽고 실패 메일만 남는다(2026-09-02 사고). 2026-09-03 제거.
      - name: Mode
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "20 7 * * *" ] || [ "${{ github.event.inputs.mode }}" = "full" ]; then
            echo "flag=" >> "$GITHUB_OUTPUT"; echo "mode=full"
          else
            echo "flag=--topup" >> "$GITHUB_OUTPUT"; echo "mode=topup"
          fi

      - name: Collect
        run: node tools/collect-auction-market.js ${{ steps.mode.outputs.flag }}

      # 팰월드 전용 관측 단계(2026-08-19~)는 2026-11-05 소유자 결정으로 지웠다. data/palworld-auction-* 은 동결 원장이라
      # 커밋·병합 목록에서도 뺐다(가드 PW1). 팰월드는 collect-tcg 의 13종 묶음에서 계속 본다.

      # 경매 원장에서 "말할 수 있는 발견"을 매번 다시 계산한다(표본·신뢰구간 기준 미달이면 내놓지 않음).
      # 2026-09-02 에 collect-status 가 이 산출물을 이 워크플로 몫으로 기대하게 됐는데 실행이 빠져 있었다(2026-09-07 발견).
      - name: Audit auction findings
        run: node tools/audit-auction-findings.js

      - name: Guard
        run: node tools/guard-invariants.js

      - name: Commit changes
        run: |
          if git diff --quiet data/auction-market.json data/auction-watch.json data/auction-findings.json; then
            echo "No auction market changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/auction-market.json data/auction-watch.json data/auction-findings.json
          git commit -m "Collect auction market snapshot"
          # 야간 워크플로나 사람 커밋과 겹칠 수 있다. 실패하면 리베이스 후 재시도.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Push failed after 3 attempts."
              exit 1
            fi
            echo "Push raced; rebasing before retry $((attempt + 1))/3."
            # 감시목록은 검색이 넣고 정산이 빼서 두 워크플로가 같이 고친다. 줄 단위 병합이 깨지면 집합 병합(tools/merge-watch-json.js)으로 잇는다.
            # 같은 concurrency 그룹이어도 몇 초 차이로 같이 시작하면 겹친다(2026-09-04·09-10 실제 — 회차가 통째로 버려졌다).
            if ! git pull --rebase; then
              for f in $(git diff --name-only --diff-filter=U); do
                case "$f" in
                  data/auction-watch.json|data/tcg-watch.json) node tools/merge-watch-json.js "$f" && git add "$f" ;;
                  *) echo "::error::병합 불가 충돌: $f"; git rebase --abort; exit 1 ;;
                esac
              done
              GIT_EDITOR=true git rebase --continue || { git rebase --abort; exit 1; }
            fi
          done

      # 실패해도 이번 실행이 받은 데이터는 남긴다 — 2026-10-14. 가드 FAIL·푸시 실패로 커밋을 못 하면 받은 원장·데이터가 러너와 함께
      # 사라졌다(9/25~9/27 P1 정지 41시간, 8/27 T2). 이 워크플로가 쓰는 파일과 오늘·어제·그제(UTC) 날짜 원장을 올린다 — 가드는 그대로 막는다.
      # 회수: 실행 화면 Artifacts. 원장(archive)은 append-only 라 덮지 말고 빠진 행만 합친다.
      - name: Keep collected data on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: collect-auction-market-data-on-failure
          path: |
            data/auction-market.json
            data/auction-watch.json
            data/auction-findings.json
          retention-days: 14
          if-no-files-found: warn
