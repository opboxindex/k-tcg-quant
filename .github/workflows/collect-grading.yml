name: Collect grading

# 그레이딩 인구를 사람 손 없이 매주 쌓는다 — 2026-08-12 신설.
#
# 왜 만드나: 그레이딩은 "매주 월요일에 사람이 로컬에서 돌린다"로 되어 있었고, 그래서 계속 놓쳤다.
#   · 2026-08-05: PSA 주간이 2주 조용히 죽어 있었다(continue-on-error 로 실패가 덮였다).
#   · 2026-08-12: psa-edition-weekly 가 7/29 에 멈춘 채 화면에는 그 값이 "THIS WEEK" 으로 나갔다.
# 사람이 기억해야 하는 절차는 언젠가 반드시 빠진다. CGC 는 공개 API 로 전부 자동화된다.
#
# ⚠️ 여기서 안 하는 것:
#   · eBay sold — eBay 가 데이터센터 IP 를 막아 **실브라우저(사용자 IP)로만** 가능하다. 자동화 불가.
#   · TAG — 포털이 SPA 렌더 DOM 이라 아직 브라우저가 필요하다.
#   · PSA — GemRate 가 헤드리스를 막아(2026-09-02) 월요일 9346 실브라우저 수동 체인(tools/MONDAY-GRADING.md 1번)만 적재한다.
#     update-market-data.yml 도 PSA 원장을 쌓지 않는다(2026-11-20 헤드리스 단계 삭제).
#
# CGC 원장 둘을 쓴다: data/cgc-card-pop.json(카드별) · data/cgc-grading-history.json(세트 총량 + Pristine/Gem 분리).
# 2026-09-30 전까지는 카드별만 담고 같은 덤프의 세트 합을 버렸다 — 세트 분리값이 8/3 에 멈춰 화면 열이 전부 '—' 였다.
# 화면값(onepiece-packs.json)과 파생 시계열(grading-series.json)은 원장과 같은 실행에서 맞춘다.

on:
  workflow_dispatch:
  schedule:
    # 매주 월요일 KST 10:30. 사용자가 월요일에 하던 그 자리를 대신한다.
    - cron: "30 1 * * 1"

permissions:
  contents: write

concurrency:
  group: collect-grading
  cancel-in-progress: false

jobs:
  cgc:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # CGC 공개 API. 그룹 목록이 11,000건이 넘어 페이지를 전부 돌아야 하므로 몇 분 걸린다.
      - name: Collect CGC card population
        run: |
          set -o pipefail
          mkdir -p logs
          node tools/collect-cgc-card-pop.js "$RUNNER_TEMP/cgc-dump.json" 2>&1 | tee logs/collect-cgc-card-pop.log

      # 적재기는 append-only 다. 같은 날짜가 이미 있으면 값만 대조하고 넘어간다.
      # 세트가 하나도 안 잡히면(absent 급증) 상류 구조가 바뀐 것이므로 여기서 멈춰야 한다.
      - name: Ingest CGC card population
        run: |
          set -o pipefail
          node tools/cgc-card-pop-api-ingest.js "$RUNNER_TEMP/cgc-dump.json" 2>&1 | tee logs/cgc-card-pop-api-ingest.log

      # 같은 덤프의 세트 합(총량 + Pristine 10 / Gem Mint 10)을 세트 원장에 담는다 — 2026-09-30.
      # 직전 관측일의 (세트|판)이 하나라도 빠지면 아무것도 안 쓰고 멈춘다(반쪽 주를 남기지 않는다).
      - name: Ingest CGC set totals and grade split
        run: |
          set -o pipefail
          node tools/cgc-set-grades-ingest.js "$RUNNER_TEMP/cgc-dump.json" 2>&1 | tee logs/cgc-set-grades-ingest.log

      # 적재가 "성공"했는데 오늘 날짜가 안 들어간 경우를 잡는다.
      # 조용히 아무것도 안 쌓는 실패가 이 프로젝트에서 실제로 두 번 났다.
      - name: Verify today landed
        run: |
          node -e '
            const fs = require("fs");
            const raw = fs.readFileSync("data/cgc-card-pop.json", "utf8");
            const today = new Date().toISOString().slice(0, 10);
            if (!raw.includes(today)) {
              console.error(`::error::cgc-card-pop.json 에 오늘(${today}) 날짜가 없다 — 수집이 조용히 실패했다`);
              process.exit(1);
            }
            const dates = [...new Set(raw.match(/\d{4}-\d{2}-\d{2}/g) || [])].sort();
            console.log(`OK — 최신 ${dates[dates.length - 1]} (총 ${dates.length}일치)`);
            const h = JSON.parse(fs.readFileSync("data/cgc-grading-history.json", "utf8"));
            if (h.gradesThrough !== today) {
              console.error(`::error::cgc-grading-history.json gradesThrough ${h.gradesThrough} ≠ 오늘(${today}) — 세트 분리값이 안 담겼다`);
              process.exit(1);
            }
            console.log(`OK — 세트 분리값 ${h.gradesThrough}`);
          '

      # 원장만 갱신하고 화면값(onepiece-packs.json 의 graderPop)을 안 바꾸면 등급 감사가
      # "화면 총량 vs 원장" 불일치로 FAIL 난다(2026-09-03 16:57 UTC 실제 — 103건). 주간 update-market-data 만
      # 이 주입을 돌렸기 때문이다. 수집한 자리에서 바로 주입한다.
      # 세트 원장에 점이 늘면 화면의 등급사 블록(set.graders)도 같이 바꿔야 한다 — 안 그러면 매일 도는
      # update-active-listings 의 등급 감사(G7: 화면 총량 = 원장 마지막 점)가 막힌다. 파생 시계열도 같이 굽는다.
      - name: Inject grades into card view
        run: |
          node tools/inject-card-grades.js
          node tools/inject-grader-editions.js
          node tools/build-grading-series.js
          node tools/compact-series.js     # 주입기가 들여쓰기로 저장한다 — 가드 T2(방문자 전송량) 때문에 압축

      - name: Guard
        run: node tools/guard-invariants.js

      - name: Commit changes
        run: |
          # 감지 목록과 커밋 목록을 반드시 같게 둔다 — 어긋나면 변경이 남아 다음 rebase 가 죽는다.
          if [ -z "$(git status --porcelain data/cgc-card-pop.json data/cgc-grading-history.json data/grading-series.json data/onepiece-packs.json)" ]; then
            echo "No CGC changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cgc-card-pop.json data/cgc-grading-history.json data/grading-series.json data/onepiece-packs.json
          git commit -m "Collect CGC population (cards + sets)"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Push failed after 3 attempts."
              exit 1
            fi
            echo "Push raced; rebasing before retry $((attempt + 1))/3."
            git pull --rebase
          done

      # 전역 신선도 감사는 **커밋 뒤에** 돈다 — 2026-09-30.
      # 커밋 앞에 있을 때 9/7·9/14·9/21·9/28 네 번 연속, 수집·적재·오늘 날짜 확인·가드를 다 통과한 CGC 결과를
      # 이 수집과 무관한 항목(PSA 판본별 12일째, TCG 감시목록 적체 등)으로 실패해 버렸다. 9/21분은 CGC 카드별
      # W39 영구 공백이 됐다. 이 감사는 알림용(실패 = 빨간불 = 메일)이지 적재 차단용이 아니다.
      # 수집 결과 자체의 검사(오늘 날짜 확인·가드)는 커밋 앞에 그대로 둔다. 가드 W4 가 이 순서를 지킨다.
      - name: Collection health
        run: node tools/audit-collection-health.js

      # 실패해도 이번 실행이 받은 데이터는 남긴다 — 2026-10-14. 가드 FAIL·푸시 실패로 커밋을 못 하면 받은 원장·데이터가 러너와 함께
      # 사라졌다(9/25~9/27 P1 정지 41시간, 8/27 T2). 이 워크플로가 쓰는 파일과 오늘·어제·그제(UTC) 날짜 원장을 올린다 — 가드는 그대로 막는다.
      # 회수: 실행 화면 Artifacts. 원장(archive)은 append-only 라 덮지 말고 빠진 행만 합친다.
      - name: Keep collected data on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: collect-grading-data-on-failure
          path: |
            data/cgc-card-pop.json
            data/cgc-grading-history.json
            data/grading-series.json
            data/onepiece-packs.json
            ${{ runner.temp }}/cgc-dump.json
            logs/
          retention-days: 14
          if-no-files-found: warn
