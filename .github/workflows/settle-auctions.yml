name: Settle auctions

# 종료된 경매를 다시 조회해 실제 낙찰가를 기록한다.
# 왜 자주 돌리나: 종료 항목의 조회 가능 기간이 보장되어 있지 않다. 끝난 직후에 읽어야 안전하다.
# 2시간 간격이면 어떤 경매든 종료 2시간 안에 정산된다(재시도 여유는 GIVE_UP_HOURS=30).
# data/auction-sold.json / auction-watch.json 은 이 워크플로와 collect-auction-market 만 쓴다.

on:
  workflow_dispatch:
  schedule:
    # 90분마다 = 하루 16회. 2026-09-02 소유자 지시("최대로 수집")로 2시간→90분으로 좁혔다.
    # 종료 경매를 더 촘촘히 정산해 시간대 공백(부분수집)을 줄인다. 쿼터는 회차마다 예산 로직이
    # 나눠 쓰므로 회차가 늘어도 하루 총량은 넘지 않는다(잔여 0이면 그 회차는 0건으로 끝난다).
    - cron: "5 0,3,6,9,12,15,18,21 * * *"
    - cron: "35 1,4,7,10,13,16,19,22 * * *"

permissions:
  contents: write

# 검색(collect-auction-market)과 같은 그룹 — 둘 다 data/auction-watch.json 을 통째로 다시 쓴다.
# 동시에 돌면 뒤에 푸시하는 쪽이 rebase 충돌로 죽고 그 회차 정산이 버려진다(2026-09-04 00:17 UTC 실제 사고,
# "could not apply ... Settle completed auctions"). 같은 그룹이면 GitHub 이 순서대로 돌린다.
concurrency:
  group: auction-ledger
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      EBAY_MARKETPLACE_ID: EBAY_US

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 부가 필드 추출 규칙(등급·판별·카드번호)은 틀리면 원장이 통째로 오염된다.
      # 소급 수정이 불가능한 데이터라 적재 전에 규칙부터 검증한다.
      - name: Verify field rules
        run: |
          node --check tools/auction-fields.js
          node --check tools/auction-archive.js
          node --check tools/settle-auctions.js
          node tools/test-auction-fields.js

      # 쿼터 판단은 settle-auctions.js 안에서 한다(tools/ebay-budget.js).
      # 예전엔 여기 quota gate 스텝이 exit 1 로 워크플로 전체를 실패시켰는데, 그게 부분수집의 원인이었다:
      # 그날 초반에 쿼터가 바닥나면 이후 2시간마다 도는 회차가 전부 "실패"로 죽어 그 시간대 정산이
      # 통째로 비었다(2026-08-27 실측: 12회 예정 중 2회만 실행 → 하루 17시간대 공백).
      # 쿼터가 없으면 실패가 아니라 "이번 회차는 건너뛰고 다음에" 가 맞다 — settle 이 잔여량을 보고
      # 스스로 0건으로 끝낸다(exit 0). 감시목록은 그대로라 쿼터가 차는 다음 회차가 밀린 것을 정산한다.
      - name: Settle
        run: node tools/settle-auctions.js

      # 팰월드 전용 정산 단계(2026-08-19~)는 2026-11-05 소유자 결정으로 지웠다. data/palworld-auction-* 은 동결 원장이라
      # 커밋·병합·아티팩트 목록에서도 뺐다(가드 PW1). 팰월드 낙찰은 collect-tcg 의 13종 묶음 정산(tcg-archive)이 계속 본다.

      # 카드 이름표(번호→이름). 카드 집계가 참조하므로 그보다 먼저 돈다. 수동 > 카탈로그 > 원장 제목 추정.
      - name: Build card names
        run: node tools/build-card-names.js

      - name: Card auction stats
        run: node tools/auction-card-stats.js

      # 일봉·주봉·월봉 집계. 아카이브를 통째로 다시 읽어 구우므로 순서·중복에 영향받지 않는다.
      - name: Build auction series
        run: node tools/build-auction-series.js

      - name: Guard
        run: node tools/guard-invariants.js

      - name: Commit changes
        run: |
          # 원장은 data/auction-archive/ 의 새 파일로 생긴다(추적되지 않는 파일).
          # git diff 는 추적 안 된 파일을 못 보므로 status 로 판단해야 한다 —
          # diff 로만 보면 "Nothing settled" 로 빠져나가 원장이 영영 커밋되지 않는다.
          if [ -z "$(git status --porcelain -- data/auction-sold.json data/auction-watch.json data/auction-card-stats.json data/card-names.json data/auction-series.json data/auction-archive)" ]; then
            echo "Nothing settled."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/auction-sold.json data/auction-watch.json data/auction-card-stats.json data/card-names.json data/auction-series.json data/auction-archive
          git commit -m "Settle completed auctions"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Push failed after 3 attempts."
              exit 1
            fi
            echo "Push raced; rebasing before retry $((attempt + 1))/3."
            # 감시목록은 검색이 넣고 정산이 빼서 두 워크플로가 같이 고친다. 줄 단위 병합이 깨지면 집합 병합(tools/merge-watch-json.js)으로 잇는다.
            if ! git pull --rebase; then
              for f in $(git diff --name-only --diff-filter=U); do
                case "$f" in
                  data/auction-watch.json|data/tcg-watch.json) node tools/merge-watch-json.js "$f" && git add "$f" ;;
                  *) echo "::error::병합 불가 충돌: $f"; git rebase --abort; exit 1 ;;
                esac
              done
              GIT_EDITOR=true git rebase --continue || { git rebase --abort; exit 1; }
            fi
          done

      # 실패해도 이번 실행이 받은 데이터는 남긴다 — 2026-10-14. 가드 FAIL·푸시 실패로 커밋을 못 하면 받은 원장·데이터가 러너와 함께
      # 사라졌다(9/25~9/27 P1 정지 41시간, 8/27 T2). 이 워크플로가 쓰는 파일과 오늘·어제·그제(UTC) 날짜 원장을 올린다 — 가드는 그대로 막는다.
      # 회수: 실행 화면 Artifacts. 원장(archive)은 append-only 라 덮지 말고 빠진 행만 합친다.
      - name: Rescue dates
        if: failure()
        run: |
          echo "D0=$(date -u +%F)" >> "$GITHUB_ENV"
          echo "D1=$(date -u -d '1 day ago' +%F)" >> "$GITHUB_ENV"
          echo "D2=$(date -u -d '2 days ago' +%F)" >> "$GITHUB_ENV"

      - name: Keep collected data on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: settle-auctions-data-on-failure
          path: |
            data/auction-sold.json
            data/auction-watch.json
            data/auction-card-stats.json
            data/card-names.json
            data/auction-series.json
            data/auction-archive/${{ env.D0 }}.json
            data/auction-archive/${{ env.D1 }}.json
            data/auction-archive/${{ env.D2 }}.json
          retention-days: 14
          if-no-files-found: warn
